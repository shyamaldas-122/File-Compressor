<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squeeze Works – File Compressor</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9e7e1;--panel:#fbfaf7;--ink:#1d2024;--mute:#656a72;--line:#c9c6bd;--steel:#7b838d;--steel2:#4b525b;--hi:#f2b705;--hiInk:#241c00;--bad:#c2392b}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--panel:#1d2025;--ink:#ecebe6;--mute:#9aa0a8;--line:#363b43;--steel:#8a929c;--steel2:#5a626c}}
:root[data-theme="dark"]{--bg:#14161a;--panel:#1d2025;--ink:#ecebe6;--mute:#9aa0a8;--line:#363b43;--steel:#8a929c;--steel2:#5a626c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Barlow",system-ui,sans-serif;min-height:100vh}
h1,h2{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;margin:0;letter-spacing:.01em}
main{max-width:720px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:clamp(2.4rem,8vw,3.6rem);line-height:.95;font-weight:700}
.sub{color:var(--mute);margin:10px 0 24px;max-width:46ch}
.card{background:var(--panel);border:2px solid var(--ink);border-radius:4px;padding:18px;box-shadow:6px 6px 0 var(--ink)}
.hide{display:none!important}
svg .hide{display:none}
.drop{border:2px dashed var(--steel);border-radius:4px;padding:40px 16px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s}
.drop:hover,.drop.over,.drop:focus-visible{background:color-mix(in srgb,var(--hi) 16%,transparent);border-color:var(--hi);outline:none}
.drop b{font:700 1.5rem "Barlow Condensed","Arial Narrow",sans-serif;display:block}
.drop span{color:var(--mute);font-size:.92rem}
.btn{font:700 1.15rem "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.04em;background:var(--hi);color:var(--hiInk);border:2px solid var(--ink);border-radius:3px;padding:12px 26px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible,.link:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink)}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;padding:6px}
.preview{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.thumb{width:110px;height:110px;flex:none;border:2px solid var(--ink);background:var(--bg);display:grid;place-items:center;overflow:hidden;border-radius:3px;font:700 1.6rem "Barlow Condensed",sans-serif;text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb pre{margin:0;padding:6px;font:10px/1.3 ui-monospace,Menlo,monospace;text-align:left;width:100%;height:100%;overflow:hidden;white-space:pre-wrap;word-break:break-all;font-weight:400}
.meta{min-width:0}
.meta h2{font-size:1.5rem;overflow-wrap:anywhere}
.meta p{margin:2px 0;color:var(--mute);font-size:.92rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stage{width:100%;display:block;border:2px solid var(--ink);border-radius:3px;background:#2a2e34;overflow:hidden}
.status{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font:700 1.5rem "Barlow Condensed",sans-serif}
.status small{font:400 .9rem "Barlow",sans-serif;color:var(--mute)}
.bar{height:12px;border:2px solid var(--ink);margin-top:8px;background:var(--bg)}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--hi) 0 10px,#1d2024 10px 20px)}
.result{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.result div{border:2px solid var(--ink);padding:8px 10px;border-radius:3px}
.result b{display:block;font:700 1.7rem "Barlow Condensed",sans-serif;line-height:1.1}
.result span{font-size:.82rem;color:var(--mute)}
/* machine */
#head{transition:transform 0s}
.pump #head{animation:pump 1.5s ease-in-out 2 both}
.crush #head{animation:crush 1.2s cubic-bezier(.6,0,.9,.3) forwards}
@keyframes pump{0%{transform:translateY(0)}45%{transform:translateY(42px)}60%{transform:translateY(42px)}100%{transform:translateY(0)}}
@keyframes crush{0%{transform:translateY(0)}100%{transform:translateY(86px)}}
#blk{transform-box:fill-box;transform-origin:50% 100%}
.pump #blk{animation:sq1 1.5s ease-in-out 2 both}
.crush #blk{animation:sq2 1.2s cubic-bezier(.6,0,.9,.3) forwards}
@keyframes sq1{0%{transform:scale(1)}45%,60%{transform:scale(1.06,.78)}100%{transform:scale(1)}}
@keyframes sq2{0%{transform:scale(1)}100%{transform:scale(1.35,.3)}}
.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}}
.puff{opacity:0}
.go .puff{animation:puff 1.1s ease-out infinite}
.go .puff:nth-child(2){animation-delay:.3s}.go .puff:nth-child(3){animation-delay:.6s}
@keyframes puff{0%{opacity:.8;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(0,-50px) scale(1.8)}}
.puff{transform-box:fill-box;transform-origin:center}
#belt line{stroke-dasharray:10 14}
.moving #belt line{animation:belt .5s linear infinite}
@keyframes belt{to{stroke-dashoffset:-24}}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:18px;z-index:10}
.modal{background:var(--panel);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--hi);max-width:380px;width:100%;padding:22px;border-radius:4px;text-align:center}
.modal h2{font-size:2rem}
.price{font:700 4rem "Barlow Condensed",sans-serif;line-height:1;margin:6px 0}
.modal p{color:var(--mute);margin:6px 0 16px}
.demo{font-size:.85rem;color:var(--bad);min-height:1.3em;margin-top:10px}
@media (max-width:480px){.preview{flex-direction:column;align-items:flex-start}.result{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.pump #head,.crush #head,.pump #blk,.crush #blk,.go .puff,.moving #belt line,.shake{animation-duration:.01s!important}}

.cat{z-index:20;text-align:center}
.cat .modal{box-shadow:8px 8px 0 var(--hi);overflow:hidden;position:relative}
.cat .face{font-size:6.5rem;line-height:1;display:inline-block;animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-8deg) scale(1)}to{transform:translateY(-18px) rotate(8deg) scale(1.12)}}
.cat .line{font:700 2rem "Barlow Condensed","Arial Narrow",sans-serif;margin:8px 0 4px;min-height:2.4rem}
.gop{position:absolute;bottom:60px;font:700 1.6rem "Barlow Condensed",sans-serif;color:var(--hiInk);background:var(--hi);border:2px solid var(--ink);border-radius:20px;padding:0 10px;opacity:0;animation:gop 1s ease-out forwards}
@keyframes gop{0%{opacity:1;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-190px) scale(1.2)}}
@media (prefers-reduced-motion:reduce){.cat .face,.gop{animation-duration:.01s!important}}
</style>
</head>
<body>
<main>
  <h1>Squeeze Works</h1>
  <p class="sub">Drop in a file. Our hydraulic press will make it smaller.</p>

  <section class="card" id="s1">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Upload a file">
      <b>Drop a file here</b><span>or click to choose one from your device</span>
    </div>
    <input type="file" id="inp" hidden>
  </section>

  <section class="card hide" id="s2">
    <div class="preview">
      <div class="thumb" id="thumb"></div>
      <div class="meta"><h2 id="fname"></h2><p id="fmeta"></p></div>
    </div>
    <div class="row">
      <button class="btn" id="go">Compress</button>
      <button class="link" id="swap">Choose another file</button>
    </div>
  </section>

  <section class="card hide" id="s3">
    <svg class="stage" id="stage" viewBox="0 0 600 300" role="img" aria-label="A hydraulic press crushing a file block">
      <defs><linearGradient id="st" x1="0" x2="1"><stop offset="0" stop-color="#9aa2ac"/><stop offset=".5" stop-color="#c5cad1"/><stop offset="1" stop-color="#7b838d"/></linearGradient></defs>
      <rect y="0" width="600" height="300" fill="#2a2e34"/>
      <!-- frame -->
      <rect x="150" y="20" width="24" height="230" fill="url(#st)"/><rect x="426" y="20" width="24" height="230" fill="url(#st)"/>
      <rect x="140" y="14" width="320" height="38" fill="#4b525b" stroke="#1d2024" stroke-width="3"/>
      <g fill="#f2b705"><rect x="150" y="22" width="40" height="8"/><rect x="230" y="22" width="40" height="8"/><rect x="310" y="22" width="40" height="8"/><rect x="390" y="22" width="40" height="8"/></g>
      <!-- piston + head -->
      <g id="head">
        <rect x="285" y="52" width="30" height="62" fill="url(#st)" stroke="#1d2024" stroke-width="2"/>
        <rect x="185" y="112" width="230" height="34" fill="#f2b705" stroke="#1d2024" stroke-width="3"/>
        <g stroke="#241c00" stroke-width="3"><line x1="200" y1="112" x2="188" y2="146"/><line x1="240" y1="112" x2="228" y2="146"/><line x1="280" y1="112" x2="268" y2="146"/><line x1="320" y1="112" x2="308" y2="146"/><line x1="360" y1="112" x2="348" y2="146"/><line x1="400" y1="112" x2="388" y2="146"/></g>
      </g>
      <!-- belt + bed -->
      <rect x="0" y="246" width="600" height="14" fill="#1d2024"/>
      <g id="belt"><line x1="0" y1="253" x2="600" y2="253" stroke="#7b838d" stroke-width="4"/></g>
      <rect x="170" y="260" width="260" height="40" fill="#4b525b" stroke="#1d2024" stroke-width="3"/>
      <!-- file block -->
      <g id="blkwrap"><g id="blk">
        <rect id="blkbox" x="245" y="186" width="110" height="60" fill="#e9e7e1" stroke="#1d2024" stroke-width="3"/>
        <image id="blkimg" class="hide" x="245" y="186" width="110" height="60" preserveAspectRatio="none"/>
        <rect id="blkedge" class="hide" x="245" y="186" width="110" height="60" fill="none" stroke="#1d2024" stroke-width="3"/>
        <text id="blkt" x="300" y="223" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="22" fill="#1d2024">FILE</text>
      </g></g>
      <!-- steam -->
      <g id="steam" fill="#e9e7e1"><circle class="puff" cx="205" cy="236" r="12"/><circle class="puff" cx="225" cy="240" r="10"/><circle class="puff" cx="395" cy="236" r="12"/><circle class="puff" cx="375" cy="240" r="10"/></g>
      <!-- gauge -->
      <g transform="translate(520 90)"><circle r="40" fill="#e9e7e1" stroke="#1d2024" stroke-width="4"/>
        <path d="M-28 20 A34 34 0 1 1 28 20" fill="none" stroke="#c2392b" stroke-width="5" stroke-dasharray="0 70 40 200"/>
        <g id="needle" style="transform:rotate(-120deg)"><line x1="0" y1="0" x2="0" y2="-30" stroke="#1d2024" stroke-width="4" stroke-linecap="round"/></g><circle r="5" fill="#1d2024"/>
        <text y="58" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-weight="700" font-size="14" fill="#e9e7e1">PRESSURE</text></g>
    </svg>
    <div class="status"><span id="stxt">Compressing…</span><span id="pct">0%</span></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="status"><small id="sub2">Loading the press</small></div>
  </section>

  <section class="card hide" id="s4">
    <h2>Compression complete</h2>
    <div class="result">
      <div><b id="r1"></b><span>Before</span></div>
      <div><b id="r2"></b><span>After</span></div>
      <div><b id="r3"></b><span>Saved</span></div>
    </div>
    <div class="row">
      <button class="btn" id="dl">Download</button>
      <button class="link" id="again">Compress another file</button>
    </div>
  </section>
</main>

<div class="scrim hide" id="pay" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="modal">
    <h2 id="ptitle">Payment required</h2>
    <div class="price">$10</div>
    <p>Pay once to download your compressed file.</p>
    <div class="row" style="justify-content:center">
      <button class="btn" id="paybtn">Pay $10</button>
      <button class="btn ghost" id="close">Cancel</button>
    </div>
    <div class="demo" id="demo" aria-live="polite"></div>
  </div>
</div>

<div class="scrim cat hide" id="cat" role="dialog" aria-modal="true" aria-label="Surprise">
  <div class="modal" id="catbox">
    <div class="face" aria-hidden="true">🐱</div>
    <div class="line" id="catline" aria-live="polite"></div>
    <div class="row" style="justify-content:center">
      <button class="btn hide" id="tap">Tap on each word</button>
      <button class="btn" id="catclose">Close</button>
    </div>
    <button class="link" id="calib" style="font-size:.8rem">Calibrate captions</button>
    <div id="calres" style="font-size:.8rem;color:var(--mute);word-break:break-all"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let file=null,outBlob=null;
const fmt=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB";
const show=id=>["s1","s2","s3","s4"].forEach(s=>$(s).classList.toggle("hide",s!==id));

const drop=$("drop"),inp=$("inp");
drop.onclick=()=>inp.click();
drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();inp.click()}};
["dragover","dragenter"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>{if(e.dataTransfer.files[0])pick(e.dataTransfer.files[0])});
inp.onchange=()=>{if(inp.files[0])pick(inp.files[0])};
$("swap").onclick=$("again").onclick=()=>{inp.value="";file=null;outBlob=null;show("s1")};

let visual=null;
async function pdfPage(f){
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
  const pg=await pdf.getPage(1),vp=pg.getViewport({scale:1.2});
  const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
  const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext:ctx,viewport:vp}).promise;
  return {src:c.toDataURL("image/jpeg",.85),w:c.width,h:c.height,pages:pdf.numPages};
}
function imgSize(src){return new Promise(r=>{const i=new Image();i.onload=()=>r({w:i.naturalWidth,h:i.naturalHeight});i.onerror=()=>r(null);i.src=src})}
async function pick(f){
  file=f;visual=null;
  $("fname").textContent=f.name;
  $("fmeta").textContent=fmt(f.size)+" · "+(f.type||"unknown type");
  const t=$("thumb");t.innerHTML="";
  const isPdf=f.type==="application/pdf"||/\.pdf$/i.test(f.name);
  if(f.type.startsWith("image/")){
    const src=URL.createObjectURL(f);const d=await imgSize(src);
    if(d)visual={src,w:d.w,h:d.h};
  }else if(isPdf&&window.pdfjsLib){
    try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      visual=await pdfPage(f);$("fmeta").textContent+=" · "+visual.pages+(visual.pages>1?" pages":" page");}catch(e){visual=null}
  }
  if(visual){const im=new Image();im.alt="Preview of "+f.name;im.src=visual.src;t.appendChild(im)}
  else if(f.type.startsWith("text/")||/\.(txt|md|json|csv|js|css|html|xml|log)$/i.test(f.name)){
    const pre=document.createElement("pre");pre.textContent=(await f.slice(0,500).text());t.appendChild(pre)}
  else t.textContent=(f.name.split(".").pop()||"FILE").slice(0,5).toUpperCase();
  show("s2");
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function gzip(f){
  const s=f.stream().pipeThrough(new CompressionStream("gzip"));
  return await new Response(s).blob();
}
$("go").onclick=async()=>{
  show("s3");
  const stage=$("stage"),fill=$("fill"),pct=$("pct"),needle=$("needle");
  stage.classList.remove("pump","crush","go","moving");
  $("blkt").textContent=(file.name.split(".").pop()||"FILE").slice(0,5).toUpperCase();
  const bi=$("blkimg"),be=$("blkedge"),bb=$("blkbox"),bt=$("blkt");
  if(visual){
    const k=Math.min(130/visual.w,86/visual.h),w=visual.w*k,h=visual.h*k,x=300-w/2,y=246-h;
    bi.setAttribute("href",visual.src);
    [bi,be].forEach(e=>{e.setAttribute("x",x);e.setAttribute("y",y);e.setAttribute("width",w);e.setAttribute("height",h);e.classList.remove("hide")});
    bb.classList.add("hide");bt.classList.add("hide");
  }else{bi.classList.add("hide");be.classList.add("hide");bb.classList.remove("hide");bt.classList.remove("hide")}
  const work=gzip(file);
  const total=6800,t0=performance.now();
  const msgs=[[0,"Loading the press"],[.2,"Building pressure"],[.55,"Applying huge pressure"],[.8,"Crushing bytes"],[.95,"Almost flat"]];
  let raf;
  const tick=()=>{
    const p=Math.min((performance.now()-t0)/total,1);
    fill.style.width=p*100+"%";pct.textContent=Math.floor(p*100)+"%";
    needle.style.transform="rotate("+(-120+p*230)+"deg)";
    const m=[...msgs].reverse().find(x=>p>=x[0]);$("sub2").textContent=m[1];
    if(p<1)raf=requestAnimationFrame(tick);
  };tick();
  stage.classList.add("moving");await sleep(900);stage.classList.remove("moving");
  stage.classList.add("pump","go");await sleep(3000);
  stage.classList.remove("pump");void stage.getBoundingClientRect();
  stage.classList.add("crush");$("stage").classList.add("shake");await sleep(1300);
  await sleep(Math.max(0,total-(performance.now()-t0)));
  outBlob=await work;
  cancelAnimationFrame(raf);fill.style.width="100%";pct.textContent="100%";
  stage.classList.remove("shake","go");
  await sleep(300);
  $("r1").textContent=fmt(file.size);$("r2").textContent=fmt(outBlob.size);
  const saved=Math.max(0,Math.round((1-outBlob.size/file.size)*100));
  $("r3").textContent=saved+"%";
  show("s4");
};

const pay=$("pay");
$("dl").onclick=()=>{$("demo").textContent="";pay.classList.remove("hide");$("paybtn").focus()};
$("close").onclick=()=>pay.classList.add("hide");
pay.onclick=e=>{if(e.target===pay)pay.classList.add("hide")};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){pay.classList.add("hide");catHide()}});

let actx=null;
function tone(t,f0,f1,dur,type,vol){
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.03);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+.02);
}
function meow(t){tone(t,520,900,.18,"sawtooth",.12);tone(t+.18,900,420,.35,"sawtooth",.12)}
function gopSound(t){tone(t,320,90,.12,"sine",.5)}
const PHRASE="Mka ladle meow gop gop gop gop gop";
let catTimers=[];
let meme=null;
function synthFallback(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    const t=actx.currentTime+.05;meow(t);gopSound(t+1.5);gopSound(t+1.85);gopSound(t+2.2);
  }catch(e){}
}
function catShow(){
  const box=$("catbox"),line=$("catline");
  $("cat").classList.remove("hide");line.textContent="";
  catTimers.forEach(clearTimeout);catTimers=[];
  box.querySelectorAll(".gop").forEach(e=>e.remove());
  let played=false;
  try{
    meme=meme||new Audio(MEME_AUDIO);meme.currentTime=0;
    const pr=meme.play();
    if(pr&&pr.catch)pr.catch(()=>{synthFallback();startSync(false)});
    played=true;
  }catch(e){synthFallback()}
  startSync(played);
}
const WORDS=PHRASE.split(" ");
const GAP_AT=2.95,GAP_MS=200;let gapDone=false,gapTimer=0;
let TIMES=[0.35,1.3,2.45,3.05,3.9,4.95,5.5,6.4],shown=-1,raf2=0,calibrating=false;
function showWord(i){
  const box=$("catbox");
  $("catline").textContent=WORDS.slice(0,i+1).join(" ");
  if(WORDS[i]==="gop"){const b=document.createElement("span");b.className="gop";b.textContent="gop!";
    b.style.left=(15+Math.random()*60)+"%";box.appendChild(b);setTimeout(()=>b.remove(),1000)}
}
function startSync(usingAudio){
  shown=-1;gapDone=false;clearTimeout(gapTimer);cancelAnimationFrame(raf2);
  if(!usingAudio){TIMES.forEach((t,i)=>catTimers.push(setTimeout(()=>showWord(i),t*1000+(t>=GAP_AT?GAP_MS:0))));return}
  const loop=()=>{
    if(calibrating||$("cat").classList.contains("hide"))return;
    const t=meme.currentTime;
    if(!gapDone&&t>=GAP_AT){gapDone=true;meme.pause();gapTimer=setTimeout(()=>{if(!$("cat").classList.contains("hide")&&!calibrating)meme.play()},GAP_MS)}
    while(shown+1<WORDS.length&&t>=TIMES[shown+1]-0.04)showWord(++shown);
    if(!meme.ended)raf2=requestAnimationFrame(loop);
  };loop();
}
$("calib").onclick=()=>{
  calibrating=true;cancelAnimationFrame(raf2);catTimers.forEach(clearTimeout);
  $("catline").textContent="Tap as each word is said";$("calres").textContent="";
  $("tap").classList.remove("hide");$("calib").classList.add("hide");
  window._ct=[];meme=meme||new Audio(MEME_AUDIO);meme.currentTime=0;meme.play();
};
$("tap").onclick=()=>{
  window._ct.push(+meme.currentTime.toFixed(2));
  const n=window._ct.length;showWord(n-1);
  if(n>=WORDS.length){
    TIMES=window._ct.slice();calibrating=false;
    $("tap").classList.add("hide");$("calib").classList.remove("hide");
    $("calres").textContent="Timings saved: ["+TIMES.join(", ")+"]";
  }
};
function catHide(){clearTimeout(gapTimer);calibrating=false;cancelAnimationFrame(raf2);$("tap").classList.add("hide");$("calib").classList.remove("hide");$("cat").classList.add("hide");catTimers.forEach(clearTimeout);if(meme){meme.pause();meme.currentTime=0}}
$("catclose").onclick=catHide;
$("paybtn").onclick=()=>{$("demo").textContent="This is a demo — no payment is processed, so no file is released.";catShow()};
</script>
</body>
</html>
